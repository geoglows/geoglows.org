# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: geoglows/geoglows.org
  branch: main
  base_url: https://geoglowsorg.vercel.app # this deployment's own origin (update if a custom domain is added)
  auth_endpoint: api/auth

# Lets editors run the admin against local files during development:
#   npx @sveltia/cms-proxy-server  (then open http://localhost:4321/admin/)
local_backend: true

media_folder: public/media
public_folder: /media

collections:
  - name: settings
    label: Site Settings
    files:
      - name: site
        label: Site
        file: src/content/settings/site.json
        fields:
          - { label: Brand name, name: brandName, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - label: Navigation
            name: nav
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
              - label: Dropdown items
                name: children
                widget: list
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Header button
            name: navCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - label: Events ticker
            name: ticker
            widget: list
            required: false
            fields:
              - { label: Date, name: date, widget: string }
              - { label: Text, name: text, widget: string }
          - { label: Footer blurb, name: footerBlurb, widget: text }
          - label: Footer columns
            name: footerColumns
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - label: Links
                name: links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Footer legal links
            name: footerLegal
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }
          - { label: Header logo (light bg), name: headerLogoLight, widget: image, required: false }
          - { label: Header logo (dark bg), name: headerLogoDark, widget: image, required: false }
          - { label: Footer logo, name: footerLogo, widget: image, required: false }
          - { label: Favicon, name: favicon, widget: image, required: false }
          - { label: Copyright line, name: copyright, widget: string, required: false, hint: "Shown after the year, e.g. GEOGLOWS · A Group on Earth Observations initiative." }
          - { label: Default SEO description, name: seoDescription, widget: text, required: false, hint: "Used for pages that don't set their own description." }
          - { label: Default social-share image, name: shareImage, widget: image, required: false, hint: "Shown when a page is shared on LinkedIn, X, Slack, etc." }

  - name: pageSections
    label: Page Sections
    files:
      - name: videos
        label: Videos page
        file: src/content/page-sections/videos.json
        fields:
          - { label: SEO title, name: seoTitle, widget: string, required: false }
          - { label: SEO description, name: seoDescription, widget: text, required: false }
          - label: Webinars section
            name: webinars
            widget: object
            required: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
          - label: Videos section
            name: videos
            widget: object
            required: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
      - name: publications
        label: Publications page
        file: src/content/page-sections/publications.json
        fields:
          - { label: SEO title, name: seoTitle, widget: string, required: false }
          - { label: SEO description, name: seoDescription, widget: text, required: false }
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Intro, name: intro, widget: text, required: false }
          - { label: Search placeholder, name: searchPlaceholder, widget: string, required: false }
          - { label: All-topics label, name: allTopicsLabel, widget: string, required: false }

  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: title
    fields:
      - { label: Title, name: title, widget: string, hint: "Browser tab + SEO title." }
      - { label: SEO description, name: description, widget: text, required: false, hint: "Meta description and social-share text for this page." }
      - { label: Social-share image, name: shareImage, widget: image, required: false }
      - label: Blocks
        name: blocks
        widget: list
        types:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading (lead), name: headingLead, widget: string }
              - { label: Heading (emphasis), name: headingEmphasis, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: text, required: false }
              - { label: Background image, name: image, widget: image, required: false }
              - label: Buttons
                name: ctas
                widget: list
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Style, name: style, widget: select, options: [amber, white, outline, navy, green], default: amber }
              - label: Featured card
                name: featured
                widget: object
                required: false
                fields:
                  - { label: Tag, name: tag, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Link, name: href, widget: string }
          - label: Stat band
            name: statBand
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
          - label: Coverage circles
            name: coverage
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: string }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Impact stories
            name: impactStories
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Stories
                name: stories
                widget: list
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Location, name: location, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Case studies
            name: caseStudies
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Location, name: location, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Source, name: source, widget: string, required: false }
                  - { label: Link, name: href, widget: string, required: false }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Countries map
            name: countriesMap
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - { label: Note, name: note, widget: text, required: false }
              - label: Pins
                name: points
                widget: list
                fields:
                  - { label: Country, name: country, widget: string }
                  - { label: Latitude, name: lat, widget: number, value_type: float, hint: "-90 to 90" }
                  - { label: Longitude, name: lng, widget: number, value_type: float, hint: "-180 to 180" }
                  - { label: Label position, name: pos, widget: select, options: [top, bottom, left, right], default: top, required: false }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Value props
            name: valueProps
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Use cases
            name: useCases
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Icon, name: icon, widget: select, options: [layers, globe, partners, waves, drop, bars, flood, capacity] }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: Testimonials
            name: testimonials
            widget: object
            fields:
              - label: Quotes
                name: quotes
                widget: list
                fields:
                  - { label: Quote, name: quote, widget: text }
                  - { label: Name, name: name, widget: string }
                  - { label: Role, name: role, widget: string }
                  - { label: Initials, name: initials, widget: string }
          - label: Partners
            name: partners
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - label: Logos
                name: logos
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Logo image, name: image, widget: image, required: false, hint: "Leave blank to show the name as text." }
                  - { label: Link, name: url, widget: string, required: false }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - { label: Anchor ID, name: anchor, widget: string, required: false, hint: "Optional id for deep-linking, e.g. partners." }
          - label: How it works
            name: howItWorks
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Steps
                name: steps
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
          - label: Newsletter
            name: newsletter
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text, required: false }
              - { label: Button label, name: buttonLabel, widget: string, default: Subscribe }
          - label: Closing CTA
            name: closingCta
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Buttons
                name: ctas
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Style, name: style, widget: select, options: [amber, white, outline, navy, green], default: amber }
          - label: News grid
            name: newsGrid
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Count, name: count, widget: number, default: 3 }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Community feed
            name: communityFeed
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - { label: Webinars count, name: webinarsCount, widget: number, default: 3, value_type: int }
              - { label: News count, name: newsCount, widget: number, default: 5, value_type: int }
          - label: Rich text
            name: richText
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Body, name: body, widget: markdown }
              - { label: Background, name: background, widget: select, options: [page, muted], default: page }
              - { label: Anchor ID, name: anchor, widget: string, required: false, hint: "Optional id for deep-linking, e.g. data." }
          - label: Feature section
            name: featureSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Tag, name: tag, widget: string, required: false, hint: "Small pill, e.g. In development" }
              - { label: Body, name: body, widget: markdown }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Image side, name: imageSide, widget: select, options: [right, left], default: right }
              - { label: Background, name: background, widget: select, options: [page, muted], default: page }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Points
                name: points
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Tools grid
            name: toolsGrid
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Category filter, name: category, widget: string, required: false, hint: "Leave blank to show all tools." }
              - { label: Limit, name: limit, widget: number, required: false, hint: "Max tools to show (e.g. 6 for a home preview). Blank shows all." }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: People grid
            name: peopleGrid
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Group filter, name: group, widget: string, required: false, hint: "e.g. Project leaders, Steering committee, Collaborators" }
              - { label: Anchor ID, name: anchor, widget: string, required: false, hint: "Optional id for deep-linking, e.g. team." }
          - label: Working groups
            name: workingGroups
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Anchor ID, name: anchor, widget: string, required: false, hint: "Optional id for deep-linking, e.g. working-groups." }
          - label: Mission hero
            name: missionHero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, default: Mission }
              - { label: Heading, name: heading, widget: text }
              - { label: Lede, name: lede, widget: text, required: false }
              - { label: Image, name: image, widget: image, required: false }
              - label: Spotlight items
                name: spotlight
                widget: list
                required: false
                fields:
                  - { label: Tag, name: tag, widget: string }
                  - { label: Text, name: text, widget: text }
              - label: Spotlight link
                name: spotlightLink
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - { label: Social heading, name: socialHeading, widget: string, default: "Latest from GEOGLOWS" }
              - { label: Social count, name: socialCount, widget: number, default: 3, value_type: int }
          - label: Trust strip
            name: trustStrip
            widget: object
            fields:
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Intro, name: intro, widget: text, required: false }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - label: Groups
                name: groups
                widget: list
                fields:
                  - { label: Label, name: label, widget: string, hint: "e.g. Funded by" }
                  - label: Logos
                    name: logos
                    widget: list
                    required: false
                    fields:
                      - { label: Name, name: name, widget: string }
                      - { label: Logo image, name: image, widget: image, required: false }
                      - { label: Link, name: url, widget: string, required: false }
                      - { label: White logo (darken on the strip), name: invert, widget: boolean, required: false, default: false }
                      - { label: Filled emblem/seal (keeps detail on dark background), name: emblem, widget: boolean, required: false, default: false, hint: "Enable for round multi-color seals like NASA, NOAA, NGA so they don't flatten to a solid disc in dark mode." }
                  - { label: Tail text, name: tail, widget: string, required: false, hint: "For members without a logo, e.g. with PREPARE" }
          - label: Partner cards
            name: partnerCards
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Stage tag, name: stageTag, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Mark (initials), name: mark, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Link, name: href, widget: string, required: false, hint: "Makes the card clickable" }
          - label: Pillars
            name: pillars
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - label: Intro link
                name: introLink
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Anchor ID, name: id, widget: string, required: false, hint: "For deep-linking from the nav, e.g. forecasting" }
                  - { label: Icon, name: icon, widget: select, options: [layers, globe, partners, waves, drop, bars, flood, capacity] }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Tag, name: tag, widget: string, required: false }
                  - { label: Image, name: image, widget: image, required: false, hint: "Optional cover photo; replaces the icon when set." }
          - label: Impact cycle
            name: impactCycle
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Stage tag, name: stageTag, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Steps
                name: steps
                widget: list
                fields:
                  - { label: Index label, name: idx, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
              - label: Stats
                name: stats
                widget: list
                required: false
                fields:
                  - { label: Number, name: num, widget: string }
                  - { label: Label, name: lbl, widget: string }
              - label: Quote (used only if no Story is set)
                name: quote
                widget: object
                required: false
                fields:
                  - { label: Quote, name: text, widget: text }
                  - { label: Attribution, name: who, widget: string }
                  - { label: Note, name: note, widget: string, required: false }
              - label: Featured story
                name: story
                widget: object
                required: false
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Location, name: location, widget: string }
                  - { label: Title, name: title, widget: text }
                  - { label: Link, name: href, widget: string, required: false }
                  - { label: Note, name: note, widget: string, required: false }
          - label: Investment
            name: investment
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - { label: Note, name: note, widget: text, required: false }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Style, name: style, widget: select, options: [amber, white, outline, navy, green], default: amber }
          - label: Audience cards
            name: audienceCards
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Kicker, name: kicker, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Link, name: href, widget: string, required: false, hint: "Makes the card clickable" }
              - { label: Contact email, name: contactEmail, widget: string, required: false }
          - label: Timeline
            name: timeline
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Timeline items
                name: items
                widget: list
                fields:
                  - { label: Year, name: year, widget: string }
                  - { label: Text, name: text, widget: text }
              - { label: Note, name: note, widget: text, required: false }
              - label: Info cards
                name: cards
                widget: list
                required: false
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Items, name: items, widget: list, field: { label: Item, name: item, widget: string } }
          - label: Featured media
            name: featuredMedia
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Featured video
                name: video
                widget: object
                required: false
                hint: "Optional video shown full-width above the cards."
                fields:
                  - { label: YouTube video ID, name: youtubeId, widget: string }
                  - { label: Title, name: title, widget: string, required: false }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Location, name: location, widget: string, required: false }
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: YouTube video ID, name: youtubeId, widget: string, required: false, hint: "Set this to make the card a video (overrides Image/Link)." }
                  - { label: Link, name: href, widget: string, required: false }
              - label: Button
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
          - label: Resource tabs
            name: resourceTabs
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text, required: false }
              - { label: Anchor ID, name: anchor, widget: string, required: false }
              - label: Tabs
                name: tabs
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Link, name: href, widget: string }
                  - { label: Description, name: description, widget: text, required: false }

  - name: tools
    label: Tools
    label_singular: Tool
    folder: src/content/tools
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: name
    sortable_fields: [order, name]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Tagline, name: tagline, widget: string }
      - { label: Category, name: category, widget: select, options: [Forecasting, Groundwater, Analysis, Mapping], default: Analysis }
      - { label: Icon, name: icon, widget: select, options: [layers, globe, partners, waves, drop, bars, flood, capacity], default: globe }
      - { label: Image, name: image, widget: image, required: false }
      - { label: App URL, name: appUrl, widget: string, required: false }
      - { label: Order, name: order, widget: number, default: 0, value_type: int }
      - { label: Description, name: body, widget: markdown }

  - name: people
